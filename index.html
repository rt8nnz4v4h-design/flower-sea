<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>花海 · Flower Sea</title>
<link rel="icon" href="data:,">
<style>
  :root{
    color-scheme:dark;
    --ui-ink:rgba(255,246,250,.9);
    --ui-muted:rgba(240,225,235,.62);
    --ui-line:rgba(255,255,255,.14);
    --ui-panel:rgba(16,13,22,.56);
    --ui-panel-strong:rgba(16,13,22,.82);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-right:env(safe-area-inset-right,0px);
  }
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#080a12}
  body{
    touch-action:manipulation;color:var(--ui-ink);-webkit-user-select:none;user-select:none;
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC",SimSun,serif;
    background:
      radial-gradient(ellipse at 50% 15%,#1a1527 0,#0a0d17 47%,#231622 100%);
  }
  button{font:inherit;color:inherit}
  button:focus-visible{outline:2px solid rgba(255,235,244,.95);outline-offset:3px}
  [hidden]{display:none!important}
  #sea{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
  #freeze-frame{position:fixed;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;z-index:1}
  body.is-grabbing #sea{cursor:grabbing}
  #hint{
    position:fixed;left:50%;bottom:24%;transform:translateX(-50%);z-index:3;
    color:rgba(255,242,248,.82);font-size:14px;line-height:1.8;letter-spacing:.2em;
    white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .7s ease
  }
  #hint.on{opacity:1}
  #cam{position:fixed;left:0;top:0;width:160px;height:120px;opacity:0;pointer-events:none;z-index:-1}
  #boot-status{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
    color:rgba(245,230,238,.58);font-size:13px;letter-spacing:.24em;pointer-events:none;
    transition:opacity .6s ease
  }
  #boot-status.is-hidden{opacity:0}
  .ui-layer{position:fixed;inset:0;z-index:5;pointer-events:none}
  .ui-layer button,.ui-layer .guide{pointer-events:auto}
  .topbar{
    position:absolute;top:max(16px,env(safe-area-inset-top,0px));left:18px;right:calc(18px + var(--safe-right));
    display:flex;align-items:center;justify-content:space-between;gap:16px
  }
  .brand{display:flex;align-items:baseline;gap:9px;text-shadow:0 1px 18px rgba(0,0,0,.55)}
  .brand strong{font-size:15px;font-weight:500;letter-spacing:.34em}
  .brand span{font:10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em;color:var(--ui-muted)}
  .icon-button{
    width:42px;height:42px;padding:0;border:1px solid var(--ui-line);border-radius:50%;
    background:rgba(12,12,18,.38);backdrop-filter:blur(12px);cursor:pointer;font-size:15px
  }
  .icon-button:hover{background:rgba(255,255,255,.1)}
  .guide{
    position:absolute;left:50%;bottom:calc(88px + var(--safe-bottom));transform:translateX(-50%);
    width:min(560px,calc(100vw - 32px));box-sizing:border-box;padding:22px 24px 19px;
    border:1px solid rgba(255,255,255,.15);border-radius:22px;
    background:linear-gradient(145deg,rgba(24,20,31,.9),rgba(12,14,21,.74));
    box-shadow:0 24px 80px rgba(0,0,0,.36);backdrop-filter:blur(20px);
    transition:opacity .32s ease,transform .32s ease
  }
  .guide.is-closing{opacity:0;transform:translate(-50%,10px);pointer-events:none}
  .guide-kicker{
    margin:0 0 8px;color:var(--ui-muted);font:10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;
    letter-spacing:.18em;text-transform:uppercase
  }
  .guide h1{margin:0;font-size:clamp(23px,3.2vw,31px);font-weight:400;letter-spacing:.12em}
  .guide p{margin:9px 0 0;color:var(--ui-muted);font-size:13px;line-height:1.75}
  .gesture-grid{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:17px 0 0;
    padding:0;list-style:none
  }
  .gesture-grid li{
    min-width:0;padding:10px 11px;border:1px solid rgba(255,255,255,.09);border-radius:13px;
    background:rgba(255,255,255,.035)
  }
  .gesture-grid b{display:block;font-size:12px;font-weight:500;letter-spacing:.08em}
  .gesture-grid small{display:block;margin-top:4px;color:var(--ui-muted);font-size:11px;line-height:1.5}
  .guide-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:17px}
  .primary-button,.secondary-button{
    min-height:42px;padding:0 17px;border-radius:999px;border:1px solid transparent;cursor:pointer;
    font-size:13px;letter-spacing:.06em
  }
  .primary-button{background:rgba(250,239,245,.94);color:#261924}
  .primary-button:hover{background:#fff}
  .secondary-button{border-color:var(--ui-line);background:rgba(255,255,255,.04);color:var(--ui-ink)}
  .secondary-button:hover{background:rgba(255,255,255,.1)}
  .privacy-note{
    display:flex;align-items:flex-start;gap:7px;margin-top:13px!important;font-size:11px!important;
    color:rgba(240,225,235,.5)!important
  }
  .privacy-note::before{content:"○";flex:0 0 auto;font-size:8px;line-height:1.9}
  .controls{
    position:absolute;left:50%;bottom:calc(18px + var(--safe-bottom));transform:translateX(-50%);
    display:flex;align-items:center;gap:5px;padding:6px;border:1px solid rgba(255,255,255,.1);
    border-radius:999px;background:rgba(10,11,17,.48);box-shadow:0 8px 30px rgba(0,0,0,.22);
    backdrop-filter:blur(16px);opacity:.72;transition:opacity .25s ease,background .25s ease
  }
  .controls:hover,.controls:focus-within{opacity:1;background:rgba(10,11,17,.7)}
  .theme-switch{display:flex;align-items:center;gap:2px;padding-right:5px;border-right:1px solid var(--ui-line)}
  .theme-button{
    position:relative;width:30px;height:32px;padding:0;border:0;border-radius:50%;background:transparent;
    cursor:pointer
  }
  .theme-button::before{
    content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%);
    border-radius:50%;background:var(--swatch);box-shadow:0 0 9px var(--swatch)
  }
  .theme-button::after{
    content:"";position:absolute;inset:5px;border:1px solid transparent;border-radius:50%;
    transition:border-color .2s ease,transform .2s ease
  }
  .theme-button:hover::after{transform:scale(1.05);border-color:rgba(255,255,255,.3)}
  .theme-button[aria-pressed="true"]::after{border-color:rgba(255,255,255,.78)}
  .control-button{
    min-width:48px;height:34px;padding:0 9px;border:0;border-radius:999px;background:transparent;
    cursor:pointer;color:rgba(255,246,250,.74);font-size:11px;letter-spacing:.04em;white-space:nowrap
  }
  .control-button:hover,.control-button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:#fff}
  .control-button.is-loading{animation:pulse 1.1s ease-in-out infinite}
  #vision-status{
    position:fixed;left:50%;bottom:calc(70px + var(--safe-bottom));transform:translateX(-50%);
    width:min(520px,calc(100vw - 40px));box-sizing:border-box;text-align:center;
    color:rgba(245,230,238,.82);font:12px/1.7 SimSun,serif;letter-spacing:.06em;
    pointer-events:none;transition:opacity .35s;opacity:0;z-index:6;text-shadow:0 1px 14px rgba(0,0,0,.9)
  }
  #fsdbg{
    position:fixed;left:10px;top:10px;color:rgba(185,222,255,.85);font:11px/1.55 Consolas,Menlo,monospace;
    white-space:pre;pointer-events:none;display:none;text-shadow:0 0 6px rgba(0,0,0,.95);z-index:9
  }
  @keyframes pulse{0%,100%{opacity:.62}50%{opacity:1}}
  @media (max-width:640px){
    .topbar{left:14px;right:calc(14px + var(--safe-right))}
    .guide{padding:19px 18px 17px;border-radius:19px}
    .gesture-grid{grid-template-columns:1fr;gap:6px}
    .gesture-grid li{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 10px}
    .gesture-grid small{margin-top:0;text-align:right}
    .controls{gap:2px}
    .control-button{min-width:42px;padding:0 6px;font-size:10px}
    .theme-button{width:27px}
  }
  @media (max-height:620px){
    .guide{top:auto;bottom:calc(78px + var(--safe-bottom));padding:15px 18px}
    .gesture-grid{margin-top:10px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<canvas id="sea" role="img" aria-label="夜光下的互动花海" aria-describedby="guide-description"></canvas>
<img id="freeze-frame" alt="" hidden>
<div id="boot-status" role="status">花海正在铺开</div>
<div id="hint" hidden><span>拖动花海 · 让风经过</span></div>
<div class="ui-layer">
  <header class="topbar">
    <div class="brand" aria-label="花海 Flower Sea"><strong>花海</strong><span>FLOWER SEA</span></div>
    <button id="help-button" class="icon-button" type="button" aria-label="打开玩法帮助" aria-controls="guide" aria-expanded="true">?</button>
  </header>
  <section id="guide" class="guide" aria-labelledby="guide-title">
    <p class="guide-kicker">Flower Sea / Movement</p>
    <h1 id="guide-title">让手成为风</h1>
    <p id="guide-description">移动会让花海起风；按住拖动，就能捧起花瓣。无须摄像头，也可以完整游览。</p>
    <ul class="gesture-grid" aria-label="基本操作">
      <li><b>拂</b><small>移动鼠标或手指</small></li>
      <li><b>捧</b><small>按住并拖动</small></li>
      <li><b>落</b><small>双击或按空格</small></li>
    </ul>
    <div class="guide-actions">
      <button id="camera-start" class="primary-button" type="button">开启手势</button>
      <button id="guide-close" class="secondary-button" type="button">先用鼠标 / 手指</button>
    </div>
    <p class="privacy-note">音乐会在首次轻触后响起。手势同样在本机识别，摄像头画面不会上传。</p>
  </section>
  <nav id="controls" class="controls" aria-label="花海控制">
    <div class="theme-switch" role="group" aria-label="选择花种">
      <button class="theme-button" type="button" data-theme="0" aria-label="玫瑰之海" aria-pressed="true" title="玫瑰之海" style="--swatch:#b53158"></button>
      <button class="theme-button" type="button" data-theme="1" aria-label="三月粉雪" aria-pressed="false" title="三月粉雪" style="--swatch:#ef9eb7"></button>
      <button class="theme-button" type="button" data-theme="2" aria-label="种子之云" aria-pressed="false" title="种子之云" style="--swatch:#dce1cc"></button>
      <button class="theme-button" type="button" data-theme="3" aria-label="十月碎金" aria-pressed="false" title="十月碎金" style="--swatch:#e6b63c"></button>
    </div>
    <button id="camera-button" class="control-button" type="button" aria-pressed="false">手势</button>
    <button id="sound-button" class="control-button" type="button" aria-pressed="true">音乐开</button>
    <button id="microphone-button" class="control-button" type="button" aria-pressed="false">吹气</button>
    <button id="pause-button" class="control-button" type="button" aria-pressed="false">暂停</button>
  </nav>
</div>
<video id="cam" playsinline muted autoplay width="320" height="240"></video>
<pre id="fsdbg"></pre>
<div id="vision-status" role="status" aria-live="polite"></div>

<script type="module">

// Models, WASM and music load on demand so the first paint stays small.
const ASSET_BASE=new URL('./assets/',import.meta.url);
const ASSET_CACHE=new Map(),EMBED_URLS=new Map();
async function embeddedBytes(key) {
  if(!ASSET_CACHE.has(key))ASSET_CACHE.set(key,(async()=>{
    const response=await fetch(new URL(key,ASSET_BASE),{cache:'force-cache'});
    if(!response.ok)throw Error(`资源加载失败（${response.status}）：${key}`);
    return new Uint8Array(await response.arrayBuffer());
  })().catch(error=>{ASSET_CACHE.delete(key);throw error;}));
  return ASSET_CACHE.get(key);
}
async function embeddedURL(key,mime) {
  if(!EMBED_URLS.has(key))EMBED_URLS.set(key,URL.createObjectURL(new Blob([await embeddedBytes(key)],{type:mime})));
  return EMBED_URLS.get(key);
}
async function embeddedFileset(mod) {
  const fileset=await mod.FilesetResolver.forVisionTasks('embedded');
  for(const [field,mime] of [['wasmLoaderPath','text/javascript'],['wasmBinaryPath','application/wasm']]) {
    fileset[field]=await embeddedURL('vision/wasm/'+fileset[field].split('/').pop(),mime);
  }
  return fileset;
}
async function createHandWorker(onResult) {
  const workerSource=`
let detector;
const ASSET_BASE=new URL(${JSON.stringify(ASSET_BASE.href)}),ASSET_CACHE=new Map(),EMBED_URLS=new Map();
${embeddedBytes.toString()}
${embeddedURL.toString()}

/* ---------------- 0. 配置（手感调节集中于此） ---------------- */

  swift: 1150,               // 「掠」的触发电速 (px/s)
  pinchOn: 0.42, pinchOff: 0.68,   // 捻：捏合距离（相对手长）
  rubLevel: 0.38,            // 搓： pinchDist 穿越此线的计数
  rubN: 3, rubWin: 1.4,      // 搓： 1 秒内 ≥4 次穿越
  rainHold: 1.15,            // 搓停后花雨延续(秒)
  stillTime: 1.35, stillSpeed: 70,  // 驻：静止判定

  vxStart: 0.78,             // 拢：双手距离(相对短边)小于此 & 靠近中 → 起势
  vxConv: -0.055,             // 拢：距离收缩速率(s^-1)
  vxClimax: 0.20,           // 拢：合至最近处 → 凝结
  vxShatter: 0.44,           // 拢：张手分离 → 炸成花雨
  // —— 吹气 ——
  blowRatio: 1.25, blowFloorX: 1.9, blowLoudMin: 0.009,
  // —— 鼠标微风 ——
  mouseMin: 45,
  // —— 其它 ——
  maxPetals: REDUCED_MOTION ? 14000 : 26000,

  handDrawScale:.43, handMaxSpan:.25,

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);

/* ---------------- 3. 精灵预渲染（花瓣图集 / 微光 / 聚合体） ---------------- */
const FOGN = 7; // 雾化级数
let fogOfZ = z => 0;
function computeFogFn() {
  const a = CFG.zNear, b = CFG.zFar + 6;
  fogOfZ = z => clamp(Math.log(z / a) / Math.log(b / a), 0, 1);
}

// Botanical silhouettes are drawn locally; reference artworks are not embedded.
function petalPath(g, mat, s, variant=0) {
  const v=variant%8;
  if(mat.key==='dandelion') {
    // A curved achene, a long slender beak, and a dense umbrella of fine pappus hairs.
    const lean=(v-3.5)*.025;
    g.lineCap='round';
    g.strokeStyle='rgba(219,223,200,.73)';g.lineWidth=Math.max(.45,s*.012);
    g.beginPath();g.moveTo(s*.03,s*.38);g.quadraticCurveTo(s*(lean+.03),s*.06,0,-s*.12);g.stroke();
    const halo=g.createRadialGradient(0,-s*.34,0,0,-s*.34,s*.53);
    halo.addColorStop(0,'rgba(249,247,229,.10)');halo.addColorStop(1,'rgba(249,247,229,0)');
    g.fillStyle=halo;g.beginPath();g.ellipse(0,-s*.32,s*.54,s*.29,0,0,TAU);g.fill();
    const n=58;
    for(let j=0;j<n;j++) {
      const t=j/(n-1),angle=Math.PI*(1.06+t*.88),seed=Math.sin(j*17.13+v*9.7);
      const x=Math.cos(angle)*s*(.43+.035*seed),y=-s*.12+Math.sin(angle)*s*(.31+.03*seed);
      g.strokeStyle=`rgba(248,247,227,${.33+.28*(.5+.5*seed)})`;g.lineWidth=s*(j%3===0?.009:.0055);
      g.beginPath();g.moveTo(0,-s*.12);g.quadraticCurveTo(x*.50,y+s*.045,x,y);g.stroke();
      // Feathered terminals stop the canopy looking like seven rigid spokes.
      g.strokeStyle='rgba(251,250,233,.32)';g.lineWidth=s*.004;
      for(let k=-1;k<=1;k+=2){g.beginPath();g.moveTo(x*.78,-s*.12+(y+s*.12)*.78);g.lineTo(x+k*s*.025,y-s*.02);g.stroke();}
    }
    const seed=g.createLinearGradient(-s*.025,s*.32,s*.055,s*.58);
    seed.addColorStop(0,'#cbb78a');seed.addColorStop(1,'#766144');g.fillStyle=seed;
    g.beginPath();g.ellipse(s*.035,s*.48,s*.021,s*.10,-.13,0,TAU);g.fill();
    return;
  }
  if(mat.key==='osmanthus') {
    // Four uneven soft corolla lobes, fused at a small shaded throat.
    const base=g.fillStyle;
    for(let j=0;j<4;j++) {
      g.save();g.rotate(j*TAU/4+(v%3-.7)*.09);
      const w=s*(.18+(j%2)*.018),h=s*(.44+(v%2)*.025);
      const gr=g.createLinearGradient(0,0,0,-h);
      gr.addColorStop(0,'#c68b28');gr.addColorStop(.5,mat.palette[v%4]);gr.addColorStop(1,'#ffe5a1');g.fillStyle=gr;
      g.beginPath();g.moveTo(-s*.07,s*.04);g.bezierCurveTo(-w,-h*.28,-w,-h*.86,-s*.025,-h);
      g.bezierCurveTo(w*.88,-h*1.08,w*1.1,-h*.45,s*.07,s*.04);g.closePath();g.fill();g.restore();
    }
    g.fillStyle='#aa7227';g.beginPath();g.ellipse(0,0,s*.075,s*.055,.3,0,TAU);g.fill();
    g.fillStyle='#f5d990';for(const x of [-.035,.035]){g.beginPath();g.ellipse(s*x,-s*.005,s*.018,s*.025,0,0,TAU);g.fill();}g.fillStyle=base;
    return;
  }
  g.beginPath();
  if(mat.key==='rose') {
    // Broad rounded lip, slight scallop, narrow attachment; neither a heart nor a disk.
    const asym=(v-3.5)*.018, curl=v%3===0;
    g.moveTo(s*.015,s*.57);
    g.bezierCurveTo(-s*.10,s*.34,-s*(.53+asym),s*.13,-s*.48,-s*.17);
    g.bezierCurveTo(-s*.47,-s*.44,-s*.24,-s*.57,-s*.055,-s*.49);
    g.bezierCurveTo(s*.10,-s*.47,s*(.27+asym),-s*.61,s*.43,-s*.40);
    g.bezierCurveTo(s*(curl?.61:.54),-s*.18,s*.37,s*.12,s*.24,s*.28);
    g.bezierCurveTo(s*.14,s*.43,s*.10,s*.54,s*.015,s*.57);
  } else {
    // Prunus: an obovate, translucent blade with a small natural apical cleft.
    const w=.37+(v%4)*.025, lean=(v-3.5)*.014;
    g.moveTo(s*.01,s*.58);
    g.bezierCurveTo(-s*.13,s*.31,-s*w,s*.10,-s*w,-s*.17);
    g.bezierCurveTo(-s*(w+.04),-s*.44,-s*.18,-s*.59,-s*.035,-s*.42);
    g.quadraticCurveTo(s*.015,-s*.34,s*.055,-s*.43);
    g.bezierCurveTo(s*.18,-s*.57,s*(w+lean),-s*.44,s*(w+.015),-s*.20);
    g.bezierCurveTo(s*(w+.08),s*.08,s*.12,s*.36,s*.01,s*.58);
  }
  g.closePath();g.fill();
}

const SPR = { atlas: {}, glow: null, blooms: {} };
function buildAtlas(mat) {
  const cell=128,variants=8,bases=[],sprites=[];
  for(let v=0;v<variants;v++) {
    const base=document.createElement('canvas');base.width=base.height=cell;const g=base.getContext('2d');
    g.save();g.translate(cell/2,cell/2);
    const pigment=mat.palette[v%4],rose=mat.key==='rose',cherry=mat.key==='cherry';
    const wash=g.createLinearGradient(-25,-48,20,49);
    wash.addColorStop(0,mixHex(pigment,rose?'#edbdc9':'#fff8f2',rose?.19:.34));
    wash.addColorStop(.40,pigment);
    wash.addColorStop(1,mixHex(pigment,rose?'#5c192d':'#d77b9e',rose?.35:.24));
    g.fillStyle=wash;petalPath(g,mat,cell*.72,v);
    if(rose||cherry) {
      g.save();g.clip();
      // Soft lamina highlights and a shaded folded edge, without animated recoloring.
      const sheen=g.createRadialGradient(-21,-16,0,-13,-12,60);
      sheen.addColorStop(0,rose?'rgba(255,221,231,.17)':'rgba(255,255,255,.38)');sheen.addColorStop(1,'rgba(255,237,241,0)');
      g.fillStyle=sheen;g.fillRect(-64,-64,128,128);
      const basal=g.createRadialGradient(1,43,1,1,43,49);
      basal.addColorStop(0,rose?'rgba(90,30,40,.24)':'rgba(193,82,125,.18)');basal.addColorStop(1,'transparent');g.fillStyle=basal;g.fillRect(-64,-64,128,128);
      for(let j=-5;j<=5;j++) {
        g.strokeStyle=rose?'rgba(239,165,187,.065)':'rgba(171,91,129,.13)';g.lineWidth=.4;
        g.beginPath();g.moveTo(1,48);g.bezierCurveTo(j*.8,20,j*5.5,-8,j*7,-43+Math.abs(j)*2);g.stroke();
      }
      if(rose && v%3!==1) {
        g.lineWidth=2;g.strokeStyle='rgba(59,10,27,.17)';g.beginPath();g.moveTo(26,-40);g.bezierCurveTo(44,-31,43,-10,29,3);g.stroke();
        g.lineWidth=.65;g.strokeStyle='rgba(251,195,208,.22)';g.beginPath();g.moveTo(25,-41);g.bezierCurveTo(42,-32,41,-11,28,2);g.stroke();
      }
      // Sparse, fixed watercolor granulation; generated once, never flickering.
      for(let j=0;j<90;j++) {
        const x=Math.sin(j*12.9898+v*7.3)*59,y=Math.cos(j*7.13+v*1.9)*58;
        g.fillStyle=j%2?'rgba(255,232,236,.023)':'rgba(65,12,29,.022)';g.fillRect(x,y,.8,.8);
      }
      g.restore();
    }
    g.restore();bases.push(base);
  }
  for(let v=0;v<variants;v++)for(let f=0;f<FOGN;f++) {
    const c=document.createElement('canvas');c.width=c.height=cell;
    const a=c.getContext('2d');a.drawImage(bases[v],0,0);
    a.globalCompositeOperation='source-atop';a.globalAlpha=(f/(FOGN-1))**1.35*(mat.floaty?.67:.91);
    a.fillStyle=mat.fogc;a.fillRect(0,0,cell,cell);sprites.push(c);
  }
  SPR.atlas[mat.key]={sprites,cell};
}

function buildGlow() {
  const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0, 'rgba(235,248,255,1)');
  rg.addColorStop(0.25, 'rgba(190,228,255,.75)');
  rg.addColorStop(0.6, 'rgba(150,205,250,.22)');
  rg.addColorStop(1, 'rgba(140,200,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, s, s);
  SPR.glow = c;
}
function buildBloom(mat) { // 「拢」的凝结体
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'); const cx = S / 2, cy = S / 2, R = S * 0.44;
  if(mat.gather==='rose') {
    g.save();g.translate(cx,cy);
    const petals=[[-38,3,-.62,1.04],[-12,-23,-.17,.93],[27,-12,.38,.98],[40,12,.70,.92],[-27,20,-.42,.92],[0,5,.05,.84],[22,18,.4,.78],[-7,29,-.1,.66],[3,-14,-.25,.46]];
    for(let i=0;i<petals.length;i++) {
      const [x,y,r,k]=petals[i];g.save();g.translate(x,y);g.rotate(r);g.scale(k,k);
      const shade=g.createLinearGradient(-28,-37,25,43);
      shade.addColorStop(0,mat.palette[2]);shade.addColorStop(.5,mat.palette[i%4]);shade.addColorStop(1,'#461025');
      g.fillStyle=shade;petalPath(g,mat,84,i%4);g.restore();
    }
    g.restore();
  } else if (mat.gather === 'seeds') {            // 种子绒球
    g.strokeStyle = 'rgba(240,244,224,.9)'; g.lineWidth = 1.4;
    const n = 34;
    for (let i = 0; i < n; i++) {
      const a = i * 2.399963 + rnd(-0.1, 0.1), r0 = R * 0.2, r1 = R * rnd(0.72, 0.95);
      const x0 = cx + Math.cos(a) * r0, y0 = cy + Math.sin(a) * r0;
      const x1 = cx + Math.cos(a) * r1, y1 = cy + Math.sin(a) * r1;
      g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
      for (let k = -2; k <= 2; k++) {
        const aa = a + k * 0.28;
        g.beginPath(); g.moveTo(x1, y1);
        g.lineTo(x1 + Math.cos(aa) * 7, y1 + Math.sin(aa) * 7); g.stroke();
      }
    }
    g.fillStyle = '#c9b96a'; g.beginPath(); g.arc(cx, cy, R * 0.18, 0, TAU); g.fill();
  } else if (mat.gather === 'mist') {             // 留不住的雾
    for (let l = 0; l < 3; l++) {
      const rr = R * (0.45 + l * 0.28);
      const rg = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
      rg.addColorStop(0, `rgba(255,214,228,${0.5 - l * 0.14})`);
      rg.addColorStop(1, 'rgba(255,190,210,0)');
      g.fillStyle = rg; g.beginPath(); g.arc(cx, cy, rr, 0, TAU); g.fill();
    }
    for (let i = 0; i < 16; i++) {
      g.save(); g.translate(cx + rnd(-R, R) * 0.7, cy + rnd(-R, R) * 0.6);
      g.rotate(rnd(0, TAU)); g.globalAlpha = rnd(0.1, 0.3);
      g.fillStyle = mat.palette[i % 4]; petalPath(g, mat, rnd(8, 16)); g.restore();
    }
  } else {                                        // 碎金
    const rg = g.createRadialGradient(cx, cy, 0, cx, cy, R);
    rg.addColorStop(0, 'rgba(255,232,150,.8)'); rg.addColorStop(1, 'rgba(240,190,70,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.fill();
    for (let i = 0; i < 90; i++) {
      const a = rnd(0, TAU), r = Math.sqrt(Math.random()) * R * 0.8;
      g.fillStyle = mat.palette[i % 4]; g.globalAlpha = rnd(0.5, 1);
      g.beginPath(); g.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.9, rnd(1.2, 2.8), 0, TAU); g.fill();
    }
  }
  SPR.blooms[mat.key] = c;
}
function buildAllSprites() { buildGlow(); for (const k of MAT_ORDER) { buildAtlas(MATS[k]); buildBloom(MATS[k]); } }

/* ---------------- 4. 背景：天空 / 远海色浪 / 星 / 暗角 ---------------- */
const BG = { sky: {}, wash: {}, stars: null, vig: null, mix: 1, from: null };
function buildSky(mat) {
  const c=document.createElement('canvas');c.width=800;c.height=600;
  const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,600);
  gr.addColorStop(0,mat.skyHi);gr.addColorStop(.58,mat.skyLo);gr.addColorStop(1,mat.fogc);
  g.fillStyle=gr;g.fillRect(0,0,800,600);
  const haze=g.createRadialGradient(440,510,10,440,510,360);
  haze.addColorStop(0,mat.farc);haze.addColorStop(1,'transparent');
  g.globalAlpha=.32;g.fillStyle=haze;g.fillRect(0,0,800,600);
  return c;
}
function buildWash(mat) {
  const w=1200,h=660,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,mat.fogc);gr.addColorStop(.08,mat.farc);

}

/* ---------------- 12. 主模拟：花瓣物理 ---------------- */
let rainAcc = 0;
function updatePetals(dt) {

const FIELD={next:0,cols:10,rows:7,coverage:[]};

    if(input.width!==inputW||input.height!==inputH){input.width=inputW;input.height=inputH;}
    VISION.inputCtx.drawImage(video,0,0,inputW,inputH);
    const res = VISION.hand.detectForVideo(input, tsH);
    parseHands(res, REAL_T);
    if (VISION.face && (faceTick++ % 3 === 0)) {
      try {
        tsF = Math.max(tsF + 1, Math.round(now) + 1);
        parseFace(VISION.face.detectForVideo(video, tsF), REAL_T);
      } catch (e) { }
    }
    VISION.lastHandN = (res.landmarks || []).length;
    if(VISION.lastHandN && !VISION.everSeen){VISION.everSeen=true;visionNotice('手已入画',1800);}
    VISION.detectErrs = 0;
  } catch (e) {
    VISION.detectErrs++;
    VISION.lastErr = (e && e.message) || String(e);
    if (VISION.detectErrs === 1) console.error('[花海] 手部检测每帧出错：', e);
    if(VISION.detectErrs>=40 && VISION.delegate==='CPU') {
      VISION.hand.close();VISION.hand=null;VISION.status='failed';
      visionNotice(/WebGL|OpenGL/i.test(VISION.lastErr)?'识别需要图形加速 · 请检查浏览器设置后按 C 重试':'手部推理失败 · 按 C 重试，按 D 查看原因');return;
    }
    if (VISION.detectErrs >= 40 && VISION.delegate !== 'CPU') { // GPU 推理持续崩溃 → 自动换 CPU
      console.warn('[花海] 检测持续失败，重建为 CPU 推理…');
      VISION.hand.close();VISION.hand = null;VISION.status='loading';
      buildHandLandmarker('CPU')
        .then(h => { VISION.hand = h; VISION.status='ready'; VISION.delegate = 'CPU'; VISION.detectErrs = 0; console.info('[花海] 已切换 CPU 推理'); })
        .catch(e2 => { VISION.status = 'failed'; VISION.lastErr = (e2 && e2.message) || String(e2); console.error('[花海] CPU 重建失败', e2); });
    }
  }
}

/* ---------------- 15. 启动 / 主循环 ---------------- */
const dbgEl = document.getElementById('fsdbg');
const hintEl = document.getElementById('hint');
const guideEl=document.getElementById('guide');
const freezeFrame=document.getElementById('freeze-frame');
const helpButton=document.getElementById('help-button');
const cameraButton=document.getElementById('camera-button');
const soundButton=document.getElementById('sound-button');
const microphoneButton=document.getElementById('microphone-button');
const pauseButton=document.getElementById('pause-button');
const themeButtons=[...document.querySelectorAll('.theme-button')];
let dbgOn=false,lastHud=0,frames=0,fps=60,lastQualityMs=0,worldPaused=false,pausedDrawAt=0;
let guideCloseTimer=0;

function setPressed(button,pressed,label){
  button?.setAttribute('aria-pressed',String(pressed));
  if(label)button.textContent=label;
}
function syncCameraButton(){
  const on=VISION.camera==='ok'||VISION.camera==='pending';
  setPressed(cameraButton,on,VISION.camera==='pending'?'连接中':on?'手势开':'手势');
  cameraButton?.classList.toggle('is-loading',VISION.camera==='pending');
}
function syncSoundButton(){setPressed(soundButton,MUSIC.enabled,MUSIC.enabled?'音乐开':'音乐');}
function syncMicrophoneButton(){setPressed(microphoneButton,AUD.on,AUD.on?'吹气开':'吹气');}
function syncPauseButton(){setPressed(pauseButton,worldPaused,worldPaused?'继续':'暂停');}
function syncThemeButtons(){
  for(const button of themeButtons)button.setAttribute('aria-pressed',String(+button.dataset.theme===SW.idx));
}
function showGuide(){
  clearTimeout(guideCloseTimer);
  guideEl.hidden=false;
  requestAnimationFrame(()=>guideEl.classList.remove('is-closing'));
  helpButton?.setAttribute('aria-expanded','true');
}
function closeGuide(){
  guideEl.classList.add('is-closing');
  helpButton?.setAttribute('aria-expanded','false');
  clearTimeout(guideCloseTimer);
  guideCloseTimer=setTimeout(()=>{guideEl.hidden=true;},340);
}
function togglePause(){
  worldPaused=!worldPaused;
  pausedDrawAt=0;
  if(worldPaused){
    try{freezeFrame.src=cv.toDataURL('image/png');freezeFrame.hidden=false;}catch{}
  }else{
    freezeFrame.hidden=true;
    freezeFrame.removeAttribute('src');
  }
  syncPauseButton();
  visionNotice(worldPaused?'画面已暂停':'继续吹风',1100);
}

let cameraStream=null, micStream=null, micPending=false;
async function ensureVideoRunning() {
  if(!video.srcObject)return;
  video.muted=true;video.playsInline=true;
  await video.play();
  if(video.readyState<2) await new Promise((resolve,reject)=>{
    const done=()=>{clearTimeout(timer);video.removeEventListener('loadeddata',done);resolve();};
    const timer=setTimeout(()=>{video.removeEventListener('loadeddata',done);reject(Error('摄像头画面未能启动'));},7000);
    video.addEventListener('loadeddata',done,{once:true});
  });
}
async function requestCamera() {
  if(VISION.cameraPending)return;
  if(!navigator.mediaDevices?.getUserMedia || !window.isSecureContext) {
    VISION.camera='no-api';syncCameraButton();startWorld();
    try{localStorage.setItem('flower-sea-guide-seen','1');}catch{}
    closeGuide();
    visionNotice('当前浏览器不支持摄像头 · 鼠标和触屏仍可游玩');return;
  }
  VISION.cameraPending=true;
  VISION.camera='pending';
  closeGuide();
  try{localStorage.setItem('flower-sea-guide-seen','1');}catch{}
  syncCameraButton();
  visionNotice('正在开启手势识别…');
  try {
    if(!cameraStream || !cameraStream.getVideoTracks().some(t=>t.readyState==='live')) {
      cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:24,max:30}},audio:false});
    }
    video.srcObject=cameraStream;VISION.camera='ok';VISION.cameraOk=true;VISION.lastVideoT=-1;
    try {await ensureVideoRunning();}
    catch(e){visionNotice('请轻点画面以启动摄像头');console.warn('[花海]',e);}
    startWorld();syncCameraButton();await initVision(cameraStream);
  }catch(e){
    VISION.camera='denied';VISION.cameraOk=false;VISION.lastErr=e.name+': '+e.message;startWorld();
    const msg=e.name==='NotFoundError'?'未找到摄像头':e.name==='NotReadableError'?'摄像头可能被其他程序占用':'摄像头尚未授权';
    visionNotice(msg+' · 也可继续用鼠标或手指');
  }finally{VISION.cameraPending=false;syncCameraButton();}
}
function stopCamera(){
  cameraStream?.getTracks().forEach(track=>track.stop());
  cameraStream=null;video.srcObject=null;
  VISION.worker?.terminate();VISION.worker=null;
  VISION.hand?.close();VISION.hand=null;VISION.face?.close();VISION.face=null;
  VISION.camera='off';VISION.cameraOk=false;VISION.status='idle';VISION.busy=false;
  for(const key of ['L','R']){const hand=HN[key];hand.on=false;hand.speed=0;}
  syncCameraButton();
  visionNotice('手势已关闭 · 鼠标和触屏仍可游玩',1300);
}
async function toggleCamera(){
  if(VISION.camera==='pending')return;
  if(VISION.camera==='ok')stopCamera();
  else await requestCamera();
}
window.addEventListener('pointerdown',()=>{if(cameraStream && video.paused)ensureVideoRunning().catch(()=>{});});


async function loadFace() {
  if(VISION.face || !AUD.on || VISION.faceLoading) return;
  VISION.faceLoading=true;
  try {
    if(!VISION.mod)VISION.mod=await importVision(CDN_LIB[0]);
    if(!VISION.fileset)VISION.fileset=typeof embeddedFileset==='function'?await embeddedFileset(VISION.mod):await VISION.mod.FilesetResolver.forVisionTasks(WASM_BASES[0]);
    const bytes=await fetchFirst(FACE_URLS);if(!bytes) throw Error('嘴部模型下载失败');
    VISION.face=await VISION.mod.FaceLandmarker.createFromOptions(VISION.fileset,{
      baseOptions:{modelAssetBuffer:bytes,delegate:'CPU'},runningMode:'VIDEO',numFaces:1});
  } catch(e) {VISION.lastErr=String(e);console.warn('[花海] 嘴部定位暂不可用',e);}
  finally {VISION.faceLoading=false;}
}
async function requestMicrophone() {
  if(AUD.on) {
    micStream?.getTracks().forEach(t=>t.stop());AUD.ctx?.close();AUD.on=false;AUD.env=0;
    syncMicrophoneButton();visionNotice('吹气已关闭',900);return;
  }
  if(micPending)return;
  if(!navigator.mediaDevices?.getUserMedia){visionNotice('当前浏览器不支持麦克风',1200);return;}
  micPending=true;
  microphoneButton?.classList.add('is-loading');
  visionNotice('正在等待麦克风授权…');
  try {
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    initAudio(micStream);await AUD.ctx?.resume();await loadFace();
    visionNotice('吹气已开启 · 朝麦克风轻轻呼气',1600);
  } catch(e) {
    console.info('[花海] 麦克风未开启，不影响花海。');
    visionNotice('麦克风未开启 · 不影响其他玩法',1300);
  } finally {micPending=false;microphoneButton?.classList.remove('is-loading');syncMicrophoneButton();}
}
window.addEventListener('pagehide',()=> {
  cameraStream?.getTracks().forEach(t=>t.stop());micStream?.getTracks().forEach(t=>t.stop());AUD.ctx?.close();
});

function startWorld() {
  if (revealT0 >= 0) return;
  revealT0 = REDUCED_MOTION ? T - 3 : T;
  setTimeout(() => hintEl.classList.remove('on'), 1700);
}

let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if(worldPaused){
    lastT=now;
    if(now-pausedDrawAt>250){
      pausedDrawAt=now;drawWorld();drawHands();drawOverlay();
    }
    return;
  }
  const dtms = now - lastT; lastT = now;
  let dt = dtms / 1000; if (dt > 0.05) dt = 0.05; if (dt <= 0) return;
  DT=dt;GDT=clamp(dtms/1000,0,.1);REAL_T=now/1000;T+=dt;
  frames++; fpsEMA = lerp(fpsEMA, dtms, 0.06);
  if(now-lastQualityMs>1800) {
    lastQualityMs=now;
    if(fpsEMA>38 && quality<3){quality++;applyQuality();}
    else if(fpsEMA<19 && quality>0){quality--;applyQuality();}
  }
  revealK = revealT0 < 0 ? 0 : clamp((T - revealT0) / 2.6, 0, 1);

  if(BG.mix<1) BG.mix=clamp((T-SW.lastSwitch)/4.5,0,1);
  visionFrame(now);
  for (const k of ['L', 'R']) {
    const h = HN[k];
    if (REAL_T-h.lastSeen>.55) {h.on=false;h.speed=0;}
    if (h.on) handGestures(h, k);
    else { // 手离开画面：放下它拿着的一切
      if (h.grip) { scatterEnt(h.grip, 0.8); h.grip = null; }
      if (h.pile) { scatterEnt(h.pile, 0.55); h.pile = null; }
      h.pinched = false; h.stillT = 0; h.collecting = false; h.flips.length = 0;
    }
  }
  if (VISION.cameraOk) twoHandGestures();
  updateBlow(dt);
  updateMouse();
  updateSwitch(dt);
  updateEnts(dt);
  updatePetals(dt);
  maintainField();

  drawWorld();
  drawHands();
  drawOverlay();

  if (dbgOn && T - lastHud > 0.25) { lastHud = T; drawHud(); }
}
let DT=.016,GDT=.016,REAL_T=performance.now()/1000;
function applyQuality() {
  farSkip = quality === 0 ? 1 : (quality === 1 ? 2 : 3);
  const target = [1, 0.8, 0.62, 0.45][quality];
  let alive = 0; for (const p of P) if (p.st !== ST.DEAD) alive++;
  const want = Math.round(MAT.n0 * target);
  if (alive > want) { // 远处先淡去
    let excess = alive - want;
    for (const p of P) {
      if (excess <= 0) break;
      if (p.st === ST.GR && p.z > 9) { p.st = ST.EXIT; p.fade = 0.6; excess--; grCount--; }
    }
  }
}
function drawHud() {
  const cnt = { gr: 0, air: 0, fl: 0, ent: 0 };
  for (const p of P) {
    if (p.st === ST.DEAD) continue;
    if (p.st === ST.GR) cnt.gr++; else if (p.st === ST.AIR) cnt.air++;
    else if (p.st === ST.FL) cnt.fl++; else cnt.ent++;
  }
  const hh = [];
  for (const k of ['L', 'R']) {
    const h = HN[k];
    hh.push(`${k}:${h.on ? '✓' : '·'} v=${h.speed.toFixed(0)} pinch=${h.pinch.toFixed(2)}${h.pinched ? '◉' : ''} open=${h.openness.toFixed(2)}${h.collecting ? ' 驻' : ''}${h.rainUntil > T ? ' 搓雨' : ''}`);
  }
  dbgEl.textContent =
    `fps≈${(1000 / fpsEMA).toFixed(0)} q${quality} petals gr=${cnt.gr} air=${cnt.air} fl=${cnt.fl} ent=${cnt.ent}\n` +
    hh.join('\n') +
    `\nvortex:${vortex ? `r=${vortex.r.toFixed(0)} n=${vortex.petals.length}` : '·'} bloom:${bloomEnt ? MAT.gather : '·'}\n` +
    `blow env=${AUD.env.toFixed(2)} ratio=${AUD.ratio.toFixed(1)} loud=${AUD.loud.toFixed(3)} mouth:${mouth.on ? '✓' : '·'}\n` +
    `cam:${VISION.camera} vision:${VISION.status}(${VISION.delegate}) 帧:${VISION.frames} 手:${VISION.lastHandN} 错:${VISION.detectErrs}\n` +
    (VISION.lastErr ? `err: ${VISION.lastErr.slice(0, 90)}\n` : '') +
    `mat:${matKey}`;
}

/* ---- 调试接口（控制台可用，便于真机调手感） ---- */
window.FS = {
  CFG, MATS, P, VISION, initVision, video,
  get mat() { return matKey; },
  setMat: i => switchMaterial(i),
  wind: (x, y, vx, vy, s, r) => addWind(x, y, vx, vy, s, r, 0.5),
  rain: (n = 300) => { for (let i = 0; i < n; i++) { const p = newP(); if (!p) break; p.st = ST.AIR; p.rain = true; p.z = lerp(2.4, 22, Math.random() ** 1.4); p.x = rnd(-1, 1) * (p.z / F) * (W / 2) * 1.05; p.y = CFG.camY+(CY+rnd(20,H*.25))*p.z/F; p.vy = -MAT.rainVy * rnd(0.8, 1.25); p.rot = rnd(0, TAU); p.rotV = rnd(-2.5, 2.5); } },
  coverage:()=>FIELD.coverage,
  retryCamera:requestCamera,
  state: () => ({ T, mat: matKey, fps: 1000 / fpsEMA, quality, petals: P.filter(p=>!p.dead).length, vision: VISION.status, camera: VISION.camera }),
};

/* ---- 冷启动 ---- */
resize();
computeFogFn();
buildAllSprites();
buildStars();
spawnField(MAT.n0);
requestAnimationFrame(frame);
setTimeout(startWorld,320);
setTimeout(()=>{
  const bootStatus=document.getElementById('boot-status');
  bootStatus?.classList.add('is-hidden');
  setTimeout(()=>{if(bootStatus)bootStatus.hidden=true;},650);
},900);
syncCameraButton();syncSoundButton();syncMicrophoneButton();syncPauseButton();syncThemeButtons();

cameraButton?.addEventListener('click',toggleCamera);
document.getElementById('camera-start')?.addEventListener('click',requestCamera);
soundButton?.addEventListener('click',toggleMusic);
microphoneButton?.addEventListener('click',requestMicrophone);
pauseButton?.addEventListener('click',togglePause);
for(const button of themeButtons)button.addEventListener('click',()=>switchMaterial(+button.dataset.theme));
helpButton?.addEventListener('click',showGuide);
document.getElementById('guide-close')?.addEventListener('click',()=>{
  closeGuide();
  try{localStorage.setItem('flower-sea-guide-seen','1');}catch{}
  hintEl.hidden=false;
  hintEl.classList.add('on');
  setTimeout(()=>{hintEl.classList.remove('on');hintEl.hidden=true;},3600);
});
guideEl.addEventListener('keydown',event=>{
  if(event.code==='Escape'){event.preventDefault();closeGuide();helpButton?.focus();}
});
window.addEventListener('keydown',event=>{
  if(event.code==='Escape'&&!guideEl.hidden){closeGuide();helpButton?.focus();}
});
cv.addEventListener('pointerdown',()=>document.body.classList.add('is-grabbing'));
window.addEventListener('pointerup',()=>document.body.classList.remove('is-grabbing'));
window.addEventListener('pointercancel',()=>document.body.classList.remove('is-grabbing'));

try{
  if(localStorage.getItem('flower-sea-guide-seen')==='1'){
    guideEl.hidden=true;
    helpButton?.setAttribute('aria-expanded','false');
  }
}catch{}
window.addEventListener('visibilitychange',()=>{lastT=performance.now();});
// 标签页标题即状态灯（不占用页面内的世界）
let lastTab = '';
function tabState(s) { if (s !== lastTab) { lastTab = s; document.title = '花海 · ' + s; } }
tabState('让手成为风');
const _tabWatch = setInterval(() => {
  if (VISION.camera === 'denied' || VISION.camera === 'no-api' || VISION.camera === 'off') tabState('鼠标与触屏');
  else if (VISION.status === 'failed') tabState('识别失败·按D看原因');
  else if (VISION.status === 'ready' || VISION.status === 'hand-ready') {
    tabState(HN.L.on || HN.R.on ? '手已入画' : '把手伸进画面');
  } else if (VISION.status === 'loading') tabState('识别加载中…');
  else if (VISION.camera === 'pending') tabState('等待摄像头授权');
}, 500);
</script>
